[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clickaway"
version = "0.5.1"
description = "Use a Windows mouse and clipboard on a Mac over the local network."
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "cryptography>=44,<51",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-CoreMedia>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-libdispatch>=11,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.16,<7",
  "dmgbuild>=1.6,<2; sys_platform == 'darwin'",
]

[project.gui-scripts]
clickaway = "clickaway.app:main"

[tool.setuptools.packages.find]
include = ["clickaway*"]

[tool.setuptools.package-data]
clickaway = ["assets/*"]
