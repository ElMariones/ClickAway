name: Test and build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-15
            name: macOS-AppleSilicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install ".[build]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Check native platform imports
        run: python -c "import importlib, sys; importlib.import_module('clickaway.windows' if sys.platform == 'win32' else 'clickaway.macos')"
      - name: Build
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClickAway-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "ClickAway $GITHUB_REF_NAME" --generate-notes
